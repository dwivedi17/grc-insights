<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberAgility — Knowledge Base & Study Notes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            800: '#075985',
                            900: '#0c4a6e',
                            dark: '#0F172A',
                            card: '#1E293B',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0F172A; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="border-b border-cyber-border bg-cyber-dark/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="app.showHome()">
                <div class="w-8 h-8 rounded bg-cyber-500/10 border border-cyber-500 flex items-center justify-center text-cyber-500 font-bold">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">Cyber<span class="text-cyber-500">Agility</span></span>
            </div>
            
            <div class="flex items-center space-x-3" id="authBtnContainer"></div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8" id="mainContent"></main>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-cyber-card border border-cyber-border rounded-xl max-w-md w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="lock" class="w-5 h-5 text-cyber-500"></i> Admin Portal Login
                </h3>
                <button onclick="app.closeModal('loginModal')" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <form onsubmit="app.handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Username / Email</label>
                    <input type="text" id="loginUser" required placeholder="admin@cyberagility.com" class="w-full bg-cyber-dark border border-cyber-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Password</label>
                    <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-cyber-dark border border-cyber-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyber-500">
                </div>
                <div id="loginError" class="text-xs text-red-400 hidden">Invalid Username or Password</div>
                <button type="submit" class="w-full bg-cyber-500 hover:bg-cyber-600 text-white font-medium py-2 rounded text-sm transition">Login</button>
            </form>
            <p class="text-xs text-gray-400 mt-4 text-center">Default: User: <code class="text-cyber-500">admin</code> | Pass: <code class="text-cyber-500">admin123</code></p>
        </div>
    </div>

    <!-- Write Article Modal -->
    <div id="writeModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-cyber-card border border-cyber-border rounded-xl max-w-2xl w-full p-6 shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="file-plus" class="w-5 h-5 text-cyber-500"></i> Create New Article
                </h3>
                <button onclick="app.closeModal('writeModal')" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <form onsubmit="app.handleCreatePost(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Article Title</label>
                    <input type="text" id="postTitle" required placeholder="e.g., Threat Modeling in Sprint Planning" class="w-full bg-cyber-dark border border-cyber-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Category Tag</label>
                    <input type="text" id="postCategory" required placeholder="e.g., DevSecOps, CloudSecurity" class="w-full bg-cyber-dark border border-cyber-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Content (Markdown supported)</label>
                    <textarea id="postContent" rows="6" required placeholder="Write your notes or study guide here..." class="w-full bg-cyber-dark border border-cyber-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyber-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-cyber-500 hover:bg-cyber-600 text-white font-medium py-2 rounded text-sm transition">Publish Article</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-cyber-border py-6 text-center text-xs text-gray-400">
        <p>&copy; CyberAgility Portal — Open Source Study & Reference Base</p>
    </footer>

    <!-- Markdown rendering and sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- App Logic Script -->
    <script>
        const defaultPosts = [
			
			{
			    id: "grc-2026",
			    title: "Understanding GRC in Cybersecurity: Governance, Risk Management, and Compliance",
			    excerpt: "Understand how Governance, Risk Management, and Compliance work together to manage cybersecurity risks, meet regulatory requirements, and improve an organization's security posture.",
			    content: "## Introduction\n\nIn cybersecurity, one of the biggest challenges organizations face is ensuring that security activities are aligned with business objectives rather than operating in isolated silos.\n\nGRC (Governance, Risk Management, and Compliance) provides a structured approach to managing cybersecurity risks, meeting regulatory and industry requirements, and establishing the policies and processes necessary to maintain an effective security posture.\n\nThe objective is not simply to implement security controls or comply with standards. It is to ensure that cybersecurity risks are identified, understood, prioritized, and managed in a way that supports the organization's overall goals.\n\n## 1. Governance: Establishing the Direction\n\nGovernance establishes the rules, responsibilities, decision-making structures, and processes through which an organization manages cybersecurity.\n\nGovernance answers important questions:\n- Who is responsible for managing cybersecurity risks?\n- Who has the authority to accept or escalate a risk?\n- What policies and procedures should the organization follow?\n- How should cybersecurity decisions align with business objectives?\n- How will management oversee cybersecurity activities?\n\nFor example, consider an organization that establishes a Risk Management Committee to oversee enterprise-wide cybersecurity risks. Defining the committee's responsibilities, membership, reporting structure, and meeting frequency falls under governance.\n\nSimilarly, establishing an information security policy, defining risk acceptance authority, and determining how cybersecurity risks should be reported to senior management are governance activities.\n\nGovernance establishes the structure within which risk management and compliance activities take place. Without effective governance, security teams may work independently, business units may follow inconsistent practices, and senior management may lack visibility into the organization's cybersecurity posture.\n\n## 2. Risk Management: Identifying and Prioritizing Risks\n\nRisk management is the process of identifying, analyzing, evaluating, prioritizing, and treating risks that could affect an organization's objectives.\n\nIn cybersecurity, risks may arise from application vulnerabilities, inadequate access controls, third-party suppliers, data breaches, operational failures, or other threats to information systems.\n\nThe objective is not to eliminate every possible risk. That may be impossible or economically impractical. Instead, organizations need to understand their risks and make informed decisions about how to manage them.\n\n### Key Steps in Risk Management\n\n1. Risk identification: Identify potential threats, vulnerabilities, and circumstances that could adversely affect the organization.\n2. Risk analysis: Assess the likelihood of a risk occurring and its potential impact.\n3. Risk evaluation and prioritization: Compare risks against established criteria, such as risk appetite and tolerance, to determine which require attention first.\n4. Risk treatment: Decide whether to mitigate, avoid, transfer, or accept a risk.\n5. Risk monitoring: Review risks and treatment plans periodically to determine whether exposure has changed.\n\n### Example: Third-Party Risk\n\nConsider an organization that relies on a third-party service provider to process sensitive customer information.\n\nIf the provider has inadequate security controls, an incident could expose customer data and result in financial losses, regulatory consequences, and reputational damage.\n\nThe organization's risk management team must assess the potential exposure, understand the business impact, determine the appropriate response, and track the risk until it is adequately addressed or formally accepted by an authorized decision-maker.\n\nThis is where governance and risk management intersect. Governance defines who is authorized to make risk-related decisions and how those decisions must be documented and escalated. Risk management applies that structure to identify, assess, and treat individual risks.\n\n## 3. Compliance: Meeting Applicable Requirements\n\nCompliance is the process of ensuring that an organization meets the laws, regulations, contractual obligations, and standards applicable to its operations.\n\nRequirements depend on the organization's industry, geographical presence, business activities, and the types of information it processes.\n\nExamples include:\n- Healthcare: Organizations subject to the US Health Insurance Portability and Accountability Act (HIPAA) must meet applicable requirements for protecting health information.\n- Payment card processing: Organizations within the scope of the Payment Card Industry Data Security Standard (PCI DSS) must meet applicable requirements for protecting payment account data.\n- Information security management: Organizations may adopt ISO/IEC 27001 to establish, implement, maintain, and continually improve an information security management system.\n\nAdopting a standard or publishing a policy does not automatically make an organization compliant. The organization needs evidence that applicable requirements are being implemented and followed.\n\nControl assessments, evidence collection, periodic reviews, internal audits, and independent assessments help establish whether requirements are being met.\n\n### Example: Access Control Compliance\n\nSuppose an organization must restrict access to sensitive customer information. A policy may state that access should be granted only to authorized individuals.\n\nTo assess compliance, the organization may review access-control configurations, examine user access records, verify approval processes, and test whether access rights are periodically reviewed.\n\nThe objective is to determine whether the required controls are appropriately designed, implemented, and operating effectively.\n\nCompliance and risk management are not the same. An organization may satisfy a particular compliance requirement and still have residual cybersecurity risks. Conversely, an organization may implement security measures to address significant risks even when a specific measure is not explicitly required by a standard.\n\nTherefore, compliance is an important part of cybersecurity, but it should not be treated as a substitute for risk management.\n\n## 4. How Governance, Risk Management, and Compliance Work Together\n\nAlthough Governance, Risk Management, and Compliance have distinct responsibilities, they are closely interconnected.\n\nConsider a third-party supplier that processes sensitive customer information.\n\n- Governance establishes the third-party risk management policy, defines responsibilities, and specifies who can approve exceptions or accept residual risks.\n- Risk Management identifies and assesses supplier-related risks, evaluates their potential business impact, and determines appropriate treatment measures.\n- Compliance determines which legal, regulatory, contractual, and standards-based requirements apply and assesses whether the organization meets those obligations.\n\nTogether, these activities provide management with a more complete understanding of the organization's security posture.\n\nThis integrated approach helps reduce silos between technical teams, business functions, risk management, compliance, and senior leadership.\n\nUltimately, GRC supports informed decision-making and helps the organization manage cybersecurity in a consistent, accountable, and business-aligned manner.\n\n## 5. Why Do Organizations Need GRC Professionals?\n\nIf technical teams implement security controls, frameworks provide guidance, and standards define requirements, why do organizations need GRC professionals?\n\nThe answer depends on the organization's size, operating environment, regulatory obligations, maturity, and cybersecurity objectives.\n\nGRC professionals do not replace security engineers, vulnerability management teams, auditors, or business leaders. Instead, they help connect their activities within a broader risk and governance structure.\n\n### A. The Consultant: Establishing the GRC Framework\n\nIn a consulting capacity, a GRC professional may help an organization design or improve its governance and risk management framework.\n\nThis may involve understanding business objectives, identifying applicable regulatory requirements, selecting appropriate frameworks, defining risk assessment methodologies, establishing policies, and determining reporting structures.\n\nFor example, an organization seeking to formalize its cybersecurity risk management program may need assistance in defining risk assessment criteria, risk ownership, escalation procedures, and risk reporting requirements.\n\nThe GRC professional helps structure these elements so that cybersecurity activities are performed consistently across the organization.\n\n### B. The Advisor: Identifying Gaps and Recommending Improvements\n\nA GRC professional may assess the organization's existing cybersecurity and compliance posture by reviewing policies, examining control evidence, conducting risk assessments, coordinating audits, identifying control gaps, and recommending remediation activities.\n\nFor example, an assessment may reveal that privileged user access is not reviewed periodically or that third-party security assessments are not performed consistently.\n\nThe GRC professional documents the finding, evaluates its significance, works with relevant stakeholders to determine appropriate corrective actions, and tracks remediation progress.\n\nThe objective is not merely to report deficiencies but to help the organization address them effectively.\n\n### C. The Communicator: Translating Technical Risk into Business Impact\n\nAnother important responsibility is communicating cybersecurity risks to stakeholders who may not have a technical background.\n\nTechnical teams may describe a vulnerability in terms of affected systems, exploitability, technical severity, and available patches. Senior management also needs to understand the potential business consequences.\n\nA GRC professional connects these perspectives by explaining how a technical issue could affect business operations, sensitive information, regulatory obligations, financial performance, or organizational reputation.\n\nThis enables decision-makers to understand the significance of a risk, evaluate remediation priorities, allocate resources, and make informed risk acceptance decisions within their authority.\n\nThe GRC professional should not independently make every technical or business decision. Rather, the role is to ensure that relevant information reaches the appropriate decision-makers and that decisions are made through the established governance process.\n\n## Conclusion\n\nGovernance, Risk Management, and Compliance are interconnected disciplines that help organizations manage cybersecurity systematically.\n\nGovernance establishes direction, responsibilities, and decision-making structures. Risk Management identifies and prioritizes risks and determines how they should be treated. Compliance helps ensure that applicable legal, regulatory, contractual, and standards-based requirements are met.\n\nGRC professionals bring these activities together by establishing frameworks, assessing control effectiveness, identifying gaps, coordinating remediation, and communicating risk to relevant stakeholders.\n\nThe ultimate objective of GRC is not simply to achieve compliance or produce risk reports. It is to enable the organization to make informed decisions, manage cybersecurity risks within its defined risk appetite, and continually improve its overall security posture.",
			    category: "GRC",
			    author: "Himanshu Dwivedi",
			    date: "2026-10-26",
			    readTime: "9 min read",
			    claps: 2731
			}

        ];

        class App {
            constructor() {
                let savedPosts = [];
                try {
                    savedPosts = JSON.parse(localStorage.getItem('cyber_posts')) || [];
                    if (!Array.isArray(savedPosts)) savedPosts = [];
                } catch (error) {
                    savedPosts = [];
                }

                // Built-in posts always appear; avoid duplicates by ID or title.
                this.posts = [
                    ...defaultPosts,
                    ...savedPosts.filter(saved =>
                        !defaultPosts.some(post => post.id === saved.id || post.title === saved.title)
                    )
                ];
                this.isAdmin = localStorage.getItem('cyber_admin') === 'true';
                this.init();
            }

            init() {
                this.renderAuthBtn();
                this.showHome();
                lucide.createIcons();
            }

            savePosts() {
                localStorage.setItem('cyber_posts', JSON.stringify(this.posts));
            }

            renderAuthBtn() {
                const container = document.getElementById('authBtnContainer');
						if (container) {
							container.innerHTML = ''; // Keeps the header clean with no login button
						}
            }

            openModal(id) { document.getElementById(id).classList.remove('hidden'); }
            closeModal(id) { document.getElementById(id).classList.add('hidden'); }

            handleLogin(e) {
                e.preventDefault();
                const user = document.getElementById('loginUser').value;
                const pass = document.getElementById('loginPass').value;
                const err = document.getElementById('loginError');

                if ((user === 'admin' || user === 'admin@cyberagility.com') && pass === 'admin123') {
                    this.isAdmin = true;
                    localStorage.setItem('cyber_admin', 'true');
                    this.closeModal('loginModal');
                    this.renderAuthBtn();
                    this.showHome();
                } else {
                    err.classList.remove('hidden');
                }
            }

            logout() {
                this.isAdmin = false;
                localStorage.removeItem('cyber_admin');
                this.renderAuthBtn();
                this.showHome();
            }

            handleCreatePost(e) {
                e.preventDefault();
                const title = document.getElementById('postTitle').value;
                const category = document.getElementById('postCategory').value;
                const content = document.getElementById('postContent').value;

                const newPost = {
                    id: Date.now().toString(),
                    title,
                    excerpt: content.substring(0, 120) + '...',
                    content,
                    category,
                    author: 'Admin',
                    date: new Date().toISOString().split('T')[0],
                    readTime: Math.ceil(content.split(' ').length / 200) + ' min read',
                    claps: 0
                };

                this.posts.unshift(newPost);
                this.savePosts();
                this.closeModal('writeModal');
                this.showHome();
            }

            showHome() {
                const container = document.getElementById('mainContent');
                container.innerHTML = `
                    <div class="mb-8 border-b border-cyber-border pb-6">
                        <h1 class="text-2xl font-bold text-white">CyberAgility Study Base</h1>
                        <p class="text-sm text-gray-400 mt-1">Technical notes, DevSecOps practices, and security revision guides.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${this.posts.map(p => `
                            <article class="bg-cyber-card border border-cyber-border rounded-lg p-5 flex flex-col justify-between hover:border-cyber-500/50 transition">
                                <div>
                                    <div class="flex items-center justify-between text-xs text-gray-400 mb-3">
                                        <span class="px-2 py-0.5 rounded bg-cyber-500/10 text-cyber-500 border border-cyber-500/20">${p.category}</span>
                                        <span>${p.readTime}</span>
                                    </div>
                                    <h2 class="text-lg font-semibold text-white mb-2 cursor-pointer hover:text-cyber-500" onclick="app.showPost('${p.id}')">${p.title}</h2>
                                    <p class="text-sm text-gray-300 line-clamp-2 mb-4">${p.excerpt}</p>
                                </div>
                                <div class="flex items-center justify-between pt-4 border-t border-cyber-border text-xs text-gray-400">
                                    <span>${p.date}</span>
                                    <button onclick="app.clap('${p.id}')" class="flex items-center space-x-1 hover:text-cyber-500">
                                        <i data-lucide="thumbs-up" class="w-4 h-4"></i>
                                        <span>${p.claps >= 1000 ? (p.claps / 1000).toFixed(1) + 'k' : p.claps}</span>
                                    </button>
                                </div>
                            </article>
                        `).join('')}
                    </div>
                `;
                lucide.createIcons();
            }

            showPost(id) {
                const post = this.posts.find(p => p.id === id);
                if (!post) return;

                const container = document.getElementById('mainContent');
                const renderedContent = DOMPurify.sanitize(marked.parse(post.content || ''));
                container.innerHTML = `
                    <button onclick="app.showHome()" class="text-xs text-cyber-500 hover:underline mb-6 flex items-center space-x-1">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span>Back to Articles</span>
                    </button>
                    <article class="bg-cyber-card border border-cyber-border rounded-lg p-6 max-w-3xl mx-auto">
                        <div class="flex items-center space-x-3 text-xs text-gray-400 mb-4">
                            <span class="px-2 py-0.5 rounded bg-cyber-500/10 text-cyber-500 border border-cyber-500/20">${post.category}</span>
                            <span>•</span>
                            <span>${post.date}</span>
                            <span>•</span>
                            <span>${post.readTime}</span>
                        </div>
                        <h1 class="text-2xl font-bold text-white mb-6">${post.title}</h1>
                        <div class="prose prose-invert max-w-none text-gray-200 text-sm leading-relaxed">${renderedContent}</div>
                    </article>
                `;
                lucide.createIcons();
            }

            clap(id) {
                const post = this.posts.find(p => p.id === id);
                if (post) {
                    post.claps++;
                    this.savePosts();
                    this.showHome();
                }
            }
        }

        const app = new App();
    </script>
</body>
</html>
