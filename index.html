			{
			    id: "cia-triad-practical-risk-assessment",
			    title: "The CIA Triad: A Practical Foundation for Information Security Risk Assessment",
			    excerpt: "A concise refresher for GRC and cybersecurity professionals on using Confidentiality, Integrity, and Availability to assess application security risks and identify appropriate safeguards.",
			    content: "## Introduction\n\nThe **CIA Triad** is one of the fundamental models of information security. It consists of three core principles: Confidentiality, Integrity, and Availability.\n\nBeyond being a theoretical security concept, the CIA Triad can be used as a practical reference during information security risk assessments. It helps GRC and cybersecurity professionals ask the right questions, understand how information and applications could be exposed to risk, and identify appropriate security controls.\n\nLet's understand each element and how it can be applied during an application security assessment.\n\n## 1. Confidentiality\n\nConfidentiality ensures that information is accessible only to authorised individuals, systems, or processes. The objective is to prevent unauthorised access or disclosure of sensitive information.\n\nWhile assessing an application, we can ask questions such as:\n\n- Who has access to the information handled by this application?\n- How do you ensure that only authorised users can access sensitive data?\n- Are appropriate authentication and authorisation controls implemented?\n- Is sensitive information protected through encryption where required?\n- Are user access rights reviewed periodically?\n\nThese questions help us understand whether the application has adequate safeguards to prevent unauthorised access and disclosure of information.\n\n## 2. Integrity\n\nIntegrity ensures that information remains accurate, complete, and protected against unauthorised modification or destruction.\n\nDuring an application assessment, we should examine how the organisation prevents, detects, and responds to unauthorised changes to information.\n\nSome relevant questions include:\n\n- How do you prevent unauthorised modification of application data?\n- Are appropriate access restrictions implemented for users who can modify or delete information?\n- Are changes to sensitive records logged and monitored?\n- Are appropriate approval and validation mechanisms in place for critical transactions?\n- How can the organisation identify whether information has been altered without authorisation?\n\nThese questions help determine whether the application has appropriate controls to maintain the accuracy and trustworthiness of its information.\n\n## 3. Availability\n\nAvailability ensures that information and systems remain accessible to authorised users whenever they are required for business operations.\n\nAn application may have strong confidentiality and integrity controls, but it can still create significant business risk if it is unavailable when needed.\n\nWhile assessing an application, we can ask:\n\n- Is the application required to be available 24/7, or does it have defined service availability requirements?\n- Are business continuity and disaster recovery arrangements in place?\n- Are regular backups maintained?\n- How frequently are backups tested to ensure that data can actually be restored?\n- Are recovery time objectives (RTO) and recovery point objectives (RPO) defined where appropriate?\n- Are adequate measures in place to protect the application against service disruption?\n\nThese questions help us understand whether the organisation can maintain or restore application services within acceptable business requirements.\n\n## 4. Applying the CIA Triad During Risk Assessment\n\nThe CIA Triad provides a structured starting point for understanding the potential impact of security risks on an application or information asset.\n\nFor example, consider a banking application that stores sensitive customer information and supports financial transactions.\n\n- A confidentiality failure could expose customer information to unauthorised individuals.\n- An integrity failure could allow unauthorised modification of customer records or financial transactions.\n- An availability failure could prevent customers from accessing banking services when required.\n\nBy examining these three dimensions, GRC professionals can develop a clearer understanding of the potential consequences of security weaknesses and determine which safeguards need to be evaluated.\n\nThe CIA Triad can also support impact assessment within an organisation's risk methodology. However, it should not be treated as a complete risk assessment methodology by itself. Likelihood, business context, financial consequences, regulatory obligations, and other relevant impacts must also be considered.\n\n## Conclusion\n\nThe CIA Triad is more than a fundamental information security concept. It is a practical way to structure security discussions and assess how risks may affect the confidentiality, integrity, and availability of organisational information.\n\nFor GRC professionals, applying these principles during application assessments helps move beyond generic security questionnaires. It encourages meaningful questions about access, data protection, unauthorised modification, service availability, backups, and recovery arrangements.\n\nRevisiting these fundamentals helps ensure that security assessments remain connected to the actual protection of business information and services.",
			    category: "GRC",
			    author: "Himanshu Dwivedi",
			    readTime: "5 min read",
			    claps: 1846
			},
			{
			    id: "pii-cybersecurity-risk-assessment",
			    title: "Personally Identifiable Information (PII): An Essential Consideration in Cybersecurity Risk Assessment",
			    excerpt: "A concise refresher for GRC professionals on understanding PII, identifying information that can identify individuals, and recognising the role of legal, privacy, and cybersecurity teams in managing associated risks.",
			    content: "## Introduction\n\nPersonally Identifiable Information (PII) is an important consideration that should be addressed during cybersecurity risk assessments. Whenever an organisation evaluates the security risks associated with its applications, systems, or business processes, it should understand whether those systems store, process, or transmit information that can identify individuals.\n\nUnderstanding PII helps organisations recognise the potential consequences of unauthorised access, disclosure, or misuse of personal information.\n\n## 1. What Is Personally Identifiable Information (PII)?\n\nPersonally Identifiable Information (PII) refers to information that can identify an individual, either directly or indirectly. In some cases, a single piece of information may be sufficient to identify someone. In other cases, a combination of information may make an individual identifiable.\n\nFor example, PII may include:\n\n- **Name:** An individual's first and last name, particularly when combined with other identifying details.\n- **Postal address or postcode:** Information that, when combined with other details, may help identify an individual.\n- **Credit card information:** Payment card details associated with an identifiable individual.\n- **Social Security Number:** A government-issued identifier that can uniquely identify an individual in jurisdictions where it is used.\n\nThe important point is that information does not always need to identify an individual on its own. A combination of seemingly ordinary details may also make someone identifiable.\n\n## 2. Why Should PII Be Considered During Cybersecurity Risk Assessment?\n\nAn organisation may operate multiple applications and business processes that collect, store, process, or transmit personal information. These applications and systems need to be considered during cybersecurity risk assessments because a security incident could expose that information to unauthorised individuals.\n\nFor example, if an application stores customer names, contact details, addresses, or financial information, a compromise of that application could result in the disclosure or misuse of personal information.\n\nTherefore, while assessing an application, GRC and cybersecurity professionals should understand:\n\n- Whether the application handles PII.\n- What categories of personal information are collected and processed.\n- Where the information is stored and transmitted.\n- Which users, systems, and third parties can access it.\n- What security controls protect the information against unauthorised access or disclosure.\n\nThe applicable definition of PII and associated obligations may vary depending on the relevant jurisdiction and privacy regulations. Organisations should therefore follow the requirements applicable to their operations and the individuals whose information they process.\n\n## 3. Understanding the Role of GRC and Legal/Privacy Teams\n\nOne important point to remember is that identifying and managing PII-related obligations should not be treated as the sole responsibility of a GRC professional.\n\nLegal and privacy specialists should be involved in determining the applicable privacy requirements, interpreting regulatory obligations, and advising on how personal information should be classified and handled.\n\nGRC and cybersecurity professionals play an important supporting role by assessing the security risks associated with the systems and applications that process this information, evaluating relevant controls, identifying security gaps, and recommending appropriate risk treatment measures.\n\nThis collaboration helps ensure that both privacy obligations and cybersecurity risks are addressed appropriately.\n\n## Conclusion\n\nPII is an essential consideration in cybersecurity risk assessment because applications and business processes may handle information that identifies individuals directly or indirectly.\n\nFor GRC professionals, the objective is to understand where personal information exists, how it is processed, and whether appropriate security controls protect it. At the same time, legal and privacy specialists should guide the interpretation of applicable privacy requirements.\n\nA coordinated approach between GRC, cybersecurity, legal, and privacy teams helps organisations protect personal information and strengthen their overall security and privacy posture.",
			    category: "GRC",
			    author: "Himanshu Dwivedi",
			    readTime: "4 min read",
			    claps: 569
			},
			{
			    id: "third-party-risk-management-overview",
			    title: "Third-Party Risk Management: A Practical Overview of the TPRM Lifecycle",
			    excerpt: "A practical introduction to TPRM, covering supplier discovery, vendor tiering, due diligence questionnaires, risk assessment, mitigation, ongoing monitoring, and vendor offboarding.",
			    content: "## Introduction\n\nThird-Party Risk Management (TPRM) is the process of identifying, assessing, monitoring, and treating risks arising from an organisation's suppliers, vendors, and external service providers. Organisations depend on third parties for technology, infrastructure, business operations, and specialised services. That dependence can introduce risks that need to be understood and managed throughout the third party's relationship with the organisation.\n\nThis article provides a practical overview of TPRM, from identifying suppliers and classifying them by risk to conducting due diligence, managing findings, and completing vendor offboarding.\n\n## 1. Why Is Third-Party Risk Management Necessary?\n\nThere are several reasons why organisations need to manage risks associated with suppliers and service providers. Two important considerations are the information they handle and the access they may have to the organisation's environment.\n\n### Exposure of Sensitive Information\n\nTo deliver contracted services, a supplier may need to access, process, store, or transmit the organisation's information. This may include confidential business information, employee details, customer data, or other sensitive records. If the supplier experiences a cyber incident, that information may be exposed, lost, or misused. The incident can therefore create consequences for the organisation, even though the affected systems are operated by an external party.\n\n### Access to the Organisation's Network and Systems\n\nSome suppliers need access to an organisation's network, applications, or infrastructure to provide specialised services. If the supplier's environment or credentials are compromised, an attacker may be able to use that trusted connection as an entry point into the organisation's environment. The level of exposure depends on the access granted, the security controls in place, and the connectivity between the two environments.\n\nThese risks make third-party risk management an essential part of an organisation's broader risk management and cybersecurity programmes. Outsourcing a service does not remove the need to understand and manage the risks associated with it.\n\n## 2. Supplier Discovery and Identification\n\nBefore assessing suppliers, an organisation needs to know which suppliers and service providers it actually uses. Supplier discovery, also called supplier identification, is the process of preparing and maintaining a comprehensive inventory of third parties.\n\nThis should not be treated as a one-time exercise. Organisations regularly onboard new suppliers, change existing arrangements, and discontinue services. The supplier inventory therefore needs to be reviewed and updated periodically so that it reflects the organisation's current third-party relationships.\n\n### Where Can We Obtain Supplier Information?\n\nA practical supplier discovery exercise should involve multiple internal stakeholders:\n\n- **Procurement:** The procurement team is a primary source because it is involved in supplier selection, contracting, purchase orders, and commercial processes. It can help identify suppliers with active contractual or purchasing relationships.\n- **Business units and department heads:** These teams use the services provided by external parties and can identify specialised suppliers that may not be obvious from central procurement records alone.\n- **IT teams:** IT teams can help identify technology suppliers, SaaS applications, hosted services, infrastructure providers, and tools configured or used across the organisation.\n\nUsing information from these sources helps create a more complete inventory than relying on a single department or system. The inventory should capture useful details such as the supplier name, service provided, business owner, contract status, data handled, and access granted, as applicable.\n\n## 3. Classifying Suppliers into Risk Tiers\n\nOnce the supplier inventory has been prepared, the next step is to classify suppliers into risk tiers. Tiering helps the organisation decide how much due diligence, oversight, and monitoring each supplier requires. It also helps teams use their resources efficiently, especially when the organisation has a large number of suppliers.\n\nA simple and practical starting methodology uses two factors: **the criticality of the service** and **the sensitivity of the information handled by the supplier**.\n\n### Factor 1: Criticality of the Service\n\nService criticality reflects how important the supplier's service is to the organisation's business operations. A useful question to ask the relevant business owner or department head is: **How long could the business continue operating if this service became unavailable?**\n\nThe answer helps indicate the potential operational impact of a disruption. The organisation can also use a service criticality matrix, business impact analysis, or defined scoring criteria to assign a consistent criticality rating.\n\n### Factor 2: Sensitivity of the Information\n\nThe second factor is the sensitivity of the information that the supplier stores, processes, or can access. One way to assess the potential impact of information compromise is to consider the three dimensions of the CIA triad:\n\n- **Confidentiality:** The impact if information is disclosed to unauthorised parties.\n- **Integrity:** The impact if information is changed, corrupted, or deleted without authorisation.\n- **Availability:** The impact if information or the supporting service becomes unavailable when required.\n\nFor a simple scoring model, the organisation may rate each dimension on a defined scale, such as 1 to 5, and use the highest of the three scores as the overall information-impact score:\n\n**Information Impact Score = MAX(Confidentiality, Integrity, Availability)**\n\nFor example, if confidentiality is rated 4, integrity is rated 3, and availability is rated 5, the overall score under this method is 5. This maximum-score approach is one possible methodology; the organisation should define its own criteria and consider any additional legal, regulatory, financial, or business impacts that are relevant.\n\n### A Simple Three-Tier Classification Model\n\nUsing service criticality and information sensitivity together, an organisation can apply the following initial tiering approach:\n\n- **Tier 1 – High risk:** Suppliers that provide a critical service and handle sensitive information.\n- **Tier 2 – Medium risk:** Suppliers that either provide a critical service or handle sensitive information, but do not meet both Tier 1 conditions.\n- **Tier 3 – Lower risk:** Suppliers that neither provide a critical service nor handle sensitive information, based on the organisation's defined criteria.\n\nThis is a practical initial classification model, not a universal standard. Organisations should define clear scoring thresholds and consider other factors where relevant, such as privileged access, connectivity to internal systems, regulatory obligations, concentration risk, and the substitutability of the supplier. A supplier's tier should also be reviewed when its services, access, or data-processing activities change.\n\n## 4. Third-Party Due Diligence and Questionnaires\n\nAfter the suppliers have been identified and classified, the organisation can begin the detailed third-party risk assessment. A common approach is to send a due diligence questionnaire to the supplier, review the responses, identify gaps, and assess the associated risks.\n\n### Tailor the Questionnaire to the Supplier\n\nA single, identical questionnaire is unlikely to be suitable for every supplier. The questions should reflect both the services being provided and the supplier's risk tier. For example, a cloud hosting provider, a payroll processor, and a facilities maintenance vendor have different service models, data access, and security considerations.\n\nThe depth of assessment should also be proportionate to the supplier's tier. Tier 1 suppliers will generally require more detailed due diligence and stronger evidence than lower-tier suppliers. A common baseline questionnaire can be supplemented with service-specific and tier-specific sections, rather than blindly reusing the same set of questions for every supplier. Suppliers with comparable services and risk profiles may use the same tailored questionnaire, provided it is appropriate to their circumstances.\n\n### Map Questions to Relevant Frameworks\n\nQuestionnaire questions should be mapped to appropriate industry standards, regulatory requirements, and contractual obligations. Depending on the service and information involved, relevant references may include:\n\n- **NIST:** Relevant cybersecurity and risk management controls and guidance.\n- **ISO/IEC 27001:** Information security management system requirements and associated control guidance.\n- **PCI DSS:** Requirements where payment card data or the cardholder data environment is in scope.\n- **HIPAA:** Applicable requirements where the supplier handles protected health information for a covered entity or business associate.\n\nThe questionnaire should not become unnecessarily long or difficult to complete. Questions should be clear, relevant, and proportionate to the supplier's services and risk profile. Framework mapping should help ensure coverage and traceability, not simply increase the number of questions.\n\n### Request and Verify Supporting Evidence\n\nThe questionnaire should include a mechanism for suppliers to provide evidence supporting their responses. Depending on the control being assessed, evidence may include policies, certifications, audit reports, configuration records, test results, or other relevant documents.\n\nA supplier may sometimes be unable to share particular evidence because of confidentiality restrictions. In such cases, the organisation may arrange a controlled live review, such as a meeting or screen-sharing session, to inspect the relevant evidence. The assessment report should clearly record what was reviewed, the date and method of review, any limitations, and the assessor's conclusion. A statement that evidence was reviewed should not be treated as equivalent to independent assurance unless the scope and verification method support that conclusion.\n\n## 5. Risk Assessment, Findings, and Mitigation Recommendations\n\nOnce the supplier has submitted the questionnaire and supporting evidence, the organisation reviews the responses and identifies control gaps, weaknesses, or areas requiring clarification. The findings should be evaluated in the context of the service being provided, the information handled, the supplier's access, and the organisation's risk criteria.\n\nThe assessment should result in a clear view of the supplier's cybersecurity and control posture, the risks identified, and the actions that may be needed. GRC, cybersecurity, procurement, the relevant business unit, and the supplier may all need to contribute, depending on the issue.\n\nWhere gaps are identified, the assessment team should recommend appropriate mitigation controls or corrective actions. The recommendations should address the actual risk rather than simply request that the supplier implement a generic list of security controls.\n\n## 6. Agreeing Risk Treatment and Tracking Actions\n\nThe identified findings and recommended controls should be discussed with the supplier and the internal business owner. The purpose is to agree how each risk will be treated and who is responsible for the required actions.\n\nCommon risk treatment options include:\n\n- **Mitigate:** Implement or improve controls to reduce the likelihood or impact of the risk.\n- **Accept:** Formally accept the risk through the organisation's authorised approval process, in line with its risk appetite.\n- **Transfer or share:** Share certain financial or contractual consequences through appropriate arrangements. This does not necessarily remove the organisation's underlying accountability.\n- **Avoid:** Stop or change the activity or service arrangement that gives rise to the risk.\n\nThe chosen treatment should be documented and agreed by the appropriate stakeholders. For every action that needs to be completed, the organisation should assign an owner and a target completion date. The TPRM team should follow up with the supplier and the internal business owner until the agreed action is completed or the remaining risk has been formally accepted by an authorised person.\n\nThe assessment report should capture relevant details, including the service provided, the supplier's risk tier, the assessment results, identified gaps, recommended controls, agreed treatment decisions, owners, and timelines. The report should be shared with the appropriate stakeholders, including the business owner and senior management or the board where the governance and reporting arrangements require it. The supplier and business unit should also have a clear understanding of the agreed actions and responsibilities.\n\n## 7. Practical Challenges in Executing TPRM\n\nA well-designed TPRM process can still fail if it is not implemented effectively. Some practical challenges need to be addressed.\n\n### Treating Automated Scans as a Substitute for TPRM\n\nSome organisations rely heavily on automated tools that perform external scans of a supplier's website, domain, or network and treat the resulting score as the complete supplier risk assessment. Such scans can provide useful technical indicators, but they do not replace a structured assessment of the supplier's services, data handling, access, governance, policies, controls, and contractual obligations. They should be used as a supporting input, not as a substitute for due diligence.\n\n### Ignoring Assessment Findings\n\nAnother common challenge is completing the assessment but failing to follow up on the findings. A report alone does not reduce risk. Each agreed action should have a clear owner and target date, and progress should be tracked until the action is completed or the remaining risk is formally accepted.\n\n### Absence of a Supplier Inventory\n\nAn organisation may not have a central or reliable list of all its suppliers and service providers. In that situation, the first step is to establish the supplier discovery process and build an inventory by working with procurement, business units, IT, and other relevant stakeholders. A complete inventory provides the foundation for the wider TPRM programme.\n\n### Managing a Very Large Supplier Population\n\nLarge organisations may have hundreds or thousands of suppliers. Assessing every supplier with the same depth at the same time can overwhelm the available teams and resources. A risk-based approach helps manage this challenge. The organisation should prioritise Tier 1 suppliers first, then plan assessments for Tier 2 and Tier 3 suppliers according to their risk, exposure, and available capacity. Lower-tier suppliers should not be ignored; the depth and frequency of assessment should simply be proportionate to their risk.\n\n## 8. The TPRM Lifecycle\n\nTPRM is not a one-time questionnaire exercise. It is a lifecycle process that begins before a supplier is onboarded and continues throughout the relationship until the supplier is offboarded. A practical lifecycle can be organised into the following stages:\n\n### Step 1: Receive the Supplier Onboarding Request\n\nThe process begins when a business unit requests a new supplier or service. The request should provide enough information to understand the service, the business need, the data involved, and the access the supplier may require.\n\n### Step 2: Perform Initial Risk Triage and Supplier Classification\n\nThe TPRM team performs an initial assessment using factors such as service criticality and information sensitivity. Other relevant factors, such as network connectivity, privileged access, regulatory scope, and the nature of the service, may also be considered. The outcome determines the supplier's initial tier and the depth of due diligence required.\n\n### Step 3: Design and Issue the Due Diligence Questionnaire\n\nThe questionnaire is selected or tailored according to the supplier's service and risk tier. It should include relevant control questions, framework mapping where applicable, and requests for supporting evidence.\n\n### Step 4: Review Responses and Assess Risk\n\nThe TPRM team reviews the supplier's responses and evidence, seeks clarification where needed, and identifies gaps. The assessment considers the potential impact on the organisation and the effectiveness of the relevant supplier controls.\n\n### Step 5: Recommend Controls and Agree the Risk Treatment\n\nThe team recommends mitigation controls or corrective actions for identified gaps. These are discussed with the supplier and the internal business owner so that the appropriate treatment decision can be agreed: mitigation, acceptance, transfer or sharing, or avoidance.\n\n### Step 6: Assign Timelines, Verify Actions, and Complete Approval\n\nAgreed actions are assigned to responsible owners with target completion dates. Once the supplier reports that an action has been completed, the organisation reviews the supporting evidence and verifies whether the response is satisfactory. Vendor approval should follow the organisation's defined acceptance criteria and approval authority. Where a risk remains open, it should be escalated or formally accepted by the appropriate authority rather than treated as resolved.\n\n### Step 7: Perform Ongoing Monitoring\n\nSupplier risk can change during the relationship. The organisation should therefore conduct periodic reviews, reassess suppliers when material changes occur, review relevant threat intelligence, and use appropriate continuous monitoring capabilities. Monitoring may include changes in services, data handled, access, security incidents, control certifications, or other risk indicators. The frequency and depth of monitoring should be proportionate to the supplier's tier and risk profile.\n\n### Vendor Offboarding\n\nWhen the business decides to discontinue a supplier relationship, a formal offboarding process should be followed. This should include removing the supplier's access to the organisation's network, applications, accounts, and facilities; recovering or returning organisational assets where applicable; and ensuring that organisational data is securely returned or deleted in accordance with contractual and legal requirements. Where appropriate, the organisation should obtain evidence or certification of data deletion and record final confirmations and sign-offs.\n\nOffboarding is an important part of the TPRM lifecycle because supplier risk does not automatically end when a contract or service arrangement ends. Access, data, assets, and outstanding obligations must be addressed and closed properly.\n\n## Conclusion\n\nThird-Party Risk Management is an essential part of an organisation's risk and cybersecurity governance. Suppliers may handle sensitive information, provide critical services, or have access to internal systems. These dependencies can create risks that need to be identified and managed throughout the supplier relationship.\n\nAn effective TPRM programme starts with a reliable supplier inventory, applies risk-based classification, and uses proportionate due diligence to assess each supplier. It then turns assessment findings into agreed treatment actions, assigns owners and timelines, verifies remediation, and continues monitoring until the relationship is formally offboarded.\n\nThe objective is not simply to send questionnaires or generate supplier security scores. It is to understand the business exposure created by third-party relationships and ensure that risks are visible, accountable, and managed through the organisation's governance process.",

			    excerpt: "A practical refresher for GRC and cybersecurity professionals on asset discovery, business criticality, information sensitivity, tiering, CMDBs, lifecycle management, and shadow IT.",
			    content: "## Introduction\n\nIT Asset Management is a foundational activity in cybersecurity and risk management. An organisation cannot effectively protect its technology environment if it does not know what assets it owns, operates, or depends on.\n\nAsset management begins with identifying the assets across the organisation, understanding their purpose and business importance, assigning ownership, and maintaining an accurate record throughout their lifecycle. This gives GRC and cybersecurity teams the context they need to prioritise security reviews, remediation, and other protective measures.\n\n## 1. What Is IT Asset Identification?\n\nAsset identification is the process of discovering and documenting the technology assets used by an organisation. These may include servers, laptops, desktops, network devices, applications, databases, cloud resources, and other systems that support business operations.\n\nThe objective is to build a reliable inventory of the assets in the organisation's environment. A list containing only asset names or serial numbers is not sufficient. We also need to understand what each asset does, which business service it supports, who owns it, and what information or systems it depends on.\n\n## 2. How Do We Identify Organisational Assets?\n\nThe exact approach depends on the organisation's size, operating model, and technology environment. In practice, asset discovery should combine several sources rather than relying on a single team or tool.\n\n- **Procurement and finance records:** These teams can provide information about hardware, software, subscriptions, and services purchased from suppliers and vendors.\n- **Business and application teams:** Discussions with the teams using the assets help identify applications, tools, devices, and services that support their day-to-day activities.\n- **IT and infrastructure teams:** These teams often maintain information about systems, applications, endpoints, network components, cloud environments, and other technology assets they configure or support.\n- **Asset discovery and security tools:** Discovery tools and authorised external or internal scanning can help identify devices and services connected to the organisation's environment, including assets that may not appear in existing records.\n\nNo single source is guaranteed to provide a complete picture. Combining procurement records, stakeholder inputs, technical inventories, and discovery results helps identify gaps and improve the accuracy of the asset inventory.\n\n## 3. Analyse and Classify Assets\n\nOnce assets have been identified, the next step is to understand their business importance and classify them. A practical approach is to assess two key factors:\n\n1. **Criticality of the service:** How important is the service supported by the asset, and how long can the business operate if that service becomes unavailable?\n2. **Sensitivity of the information:** What type of information does the asset store, process, or transmit, and what would be the consequence if that information were exposed, altered, or made unavailable?\n\n### Assessing Service Criticality\n\nA useful starting point is to discuss the asset and the service it supports with the relevant business owner. Ask a simple question: **How long can the business tolerate this service being unavailable?**\n\nThe answer helps establish the business impact of an outage. For example, a service that cannot tolerate even a short interruption may be considered highly critical, while a service that can remain unavailable for a longer period without materially affecting business operations may have a lower criticality.\n\nOrganisations can formalise this assessment through a criticality matrix, using defined outage or recovery-time bands and business impact criteria. The thresholds should be agreed with business stakeholders and aligned with business continuity requirements; they should not be assumed to be the same for every organisation.\n\n### Assessing Information Sensitivity\n\nThe sensitivity assessment should consider the consequences of compromising the information associated with an asset. The CIA triad provides a useful structure:\n\n- **Confidentiality:** What would happen if unauthorised people accessed or disclosed the information?\n- **Integrity:** What would happen if the information were changed, corrupted, or deleted without authorisation?\n- **Availability:** What would happen if the information or the supporting system were unavailable when needed?\n\nAn organisation may assign scores to each dimension using its approved assessment scale. Where its methodology uses the highest of the three scores as the overall CIA impact score, it can apply:\n\n**CIA Impact Score = MAX(Confidentiality, Integrity, Availability)**\n\nThis is one possible scoring method. The organisation should document its criteria and apply them consistently. It is also important to keep service criticality and information sensitivity visible as separate assessment factors, even when they are combined for an overall asset classification.\n\n### Example of Asset Tiering\n\nAn organisation may use a simple three-tier classification model:\n\n- **Tier 1 — High criticality:** Assets that both support a critical business service and hold sensitive information.\n- **Tier 2 — Medium criticality:** Assets that meet one of these two criteria: they support a critical business service, or they hold sensitive information, but not both.\n- **Tier 3 — Lower criticality:** Assets that neither support a critical business service nor hold sensitive information, based on the organisation's assessment criteria.\n\nThe organisation should define what qualifies as a critical service and sensitive information, document the thresholds, and apply the classification consistently. This approach helps distinguish assets that need the highest level of attention from those that can be assessed through a proportionate process.\n\n## 4. Maintain an Asset Inventory or CMDB\n\nThe information collected during identification and classification should be maintained in a central record. This may begin as a structured spreadsheet or be maintained in an asset management platform. Larger or more complex environments may use a **Configuration Management Database (CMDB)** to record configuration items and their relationships.\n\nDepending on the organisation's requirements, the record should capture information such as:\n\n- Asset name, unique identifier, serial number, and asset type.\n- Business purpose and the services supported.\n- Asset owner and responsible support or maintenance team.\n- Location, environment, and relevant technical or configuration details.\n- Information classification and the type of data handled.\n- Service criticality, CIA impact, and assigned asset tier.\n- Dependencies on other assets, applications, or third-party services.\n- Lifecycle status, such as planned, active, under maintenance, or retired.\n\nA well-maintained inventory or CMDB helps the organisation identify its critical assets and understand the services and dependencies associated with them. This information supports prioritisation of vulnerability remediation, security improvements, recovery planning, and other preventive actions.\n\n## 5. Asset Management Is an Ongoing Activity\n\nAsset management is not a one-time exercise. Organisations regularly onboard new technology, expand business operations, introduce applications, change service providers, and retire systems that are no longer required.\n\nThe asset inventory must therefore be reviewed and updated periodically. Changes should also be reflected when significant events occur, such as a new project, application deployment, infrastructure migration, acquisition, or system retirement.\n\nOwnership and accountability are important. Each asset should have an identified owner or responsible team that can confirm its purpose, business use, and continued need. Retired assets should be formally removed from active inventories, and their access, data, and disposal requirements should be addressed through the organisation's processes.\n\n## 6. Watch for Unmanaged Assets and Shadow IT\n\nA practical challenge in many organisations is the use of applications and tools that are not formally managed or approved. Employees may install browser extensions, desktop applications, collaboration tools, or other utilities because they make day-to-day work easier.\n\nThere is nothing inherently wrong with using productivity tools, but unmanaged installations can create security and governance gaps. The organisation may not know that the software exists, who is responsible for it, what data it can access, or whether it is being updated and patched.\n\nIf updates and security patches are not applied, known vulnerabilities may remain exposed and create opportunities for attackers. Unapproved tools may also introduce data leakage, excessive permissions, unsupported software, or third-party risks.\n\nOrganisations should establish a proportionate process for software approval and discovery. This can include maintaining an approved software catalogue, using endpoint and software inventory tools, applying centralised patch management, reviewing exceptions, and removing applications that are no longer authorised or required.\n\n## 7. Prioritise Critical Assets First\n\nLarge organisations may have hundreds or thousands of assets. Attempting to perform a detailed assessment of every asset at the same time can overwhelm available teams and resources.\n\nA practical approach is to use the asset classification to plan the work in stages. Start with Tier 1 assets, complete the required identification and assessment activities, and then extend coverage to Tier 2 and Tier 3 assets according to the organisation's risk priorities and available resources.\n\nThis does not mean lower-tier assets can be ignored. They should remain in the inventory and be covered by an appropriate baseline of security and lifecycle controls. The tiering approach simply helps ensure that the most business-critical assets receive attention first.\n\n## Conclusion\n\nEffective IT asset management is more than maintaining a list of devices and serial numbers. It requires an understanding of what each asset does, which business service it supports, what information it handles, who is accountable for it, and how important it is to the organisation.\n\nFor GRC and cybersecurity professionals, a reliable asset inventory provides the foundation for risk assessment, vulnerability management, security control prioritisation, and business continuity planning. By keeping the inventory current, classifying assets consistently, and addressing unmanaged technology, organisations can make better-informed decisions and strengthen their overall cyber resilience.",

			    content: "## Introduction\n\nCybersecurity is not solely the responsibility of the IT department. Effective cybersecurity requires coordination between technology teams, governance and risk functions, and independent assurance functions.\n\nOne useful governance framework for understanding these responsibilities is the **Three Lines Model**, commonly referred to as the Three Lines of Defence (3LOD) model. It helps organisations establish clear accountability for managing risks, implementing controls, monitoring compliance, and providing independent assurance.\n\nLet's understand how this model applies to cybersecurity and what organisations should keep in mind when conducting cybersecurity audits.\n\n## 1. Understanding the Three Lines Model\n\nThe Three Lines Model provides a structured way to distinguish between operational responsibilities, risk oversight, and independent assurance.\n\n### First Line – Operational Ownership and Control Implementation\n\nThe first line consists of the business and operational teams responsible for delivering services and managing risks as part of their day-to-day activities.\n\nIn the context of cybersecurity, this may include IT operations, infrastructure management, application teams, network teams, and security operations teams.\n\nTheir responsibilities include:\n\n- Implementing and operating cybersecurity controls.\n- Managing applications, infrastructure, networks, and endpoints.\n- Performing security monitoring and responding to incidents.\n- Applying security patches and managing vulnerabilities.\n- Ensuring that security requirements are followed during day-to-day operations.\n\nFor example, the infrastructure team is responsible for implementing security configurations, applying patches, and maintaining the security of servers and network devices. Similarly, a security operations team may use SIEM capabilities to monitor events and identify suspicious activities.\n\nThe important point is that the first line owns and manages the risks associated with its operations. It is responsible for implementing and maintaining the controls.\n\n### Second Line – Governance, Risk Oversight, and Compliance\n\nThe second line generally consists of functions such as GRC, information security governance, enterprise risk management, and compliance.\n\nIts primary responsibility is to provide oversight, guidance, monitoring, and challenge to the first line.\n\nIn the context of cybersecurity, the second line may:\n\n- Define cybersecurity policies, standards, and governance requirements.\n- Establish the organisation's cybersecurity strategy and risk management framework.\n- Monitor whether security controls are being implemented appropriately.\n- Conduct risk assessments and compliance reviews.\n- Challenge control gaps and track remediation activities.\n- Provide guidance and awareness to business and technology teams.\n\nFor example, the GRC team may define the organisation's vulnerability management requirements, establish remediation timelines based on risk, and periodically monitor whether the IT teams are meeting those requirements.\n\nHowever, the second line does not take over the first line's responsibility for operating controls and managing day-to-day risks.\n\n### Third Line – Independent Assurance Through Internal Audit\n\nThe third line is generally represented by the Internal Audit function.\n\nIts responsibility is to provide independent and objective assurance regarding the effectiveness of governance, risk management, and internal controls.\n\nIn the cybersecurity context, internal audit may:\n\n- Evaluate the design and operating effectiveness of cybersecurity controls.\n- Review the organisation's risk management and governance arrangements.\n- Examine whether security policies and procedures are being followed.\n- Identify control weaknesses and report audit observations.\n- Recommend improvements to strengthen the control environment.\n\nFor example, internal audit may independently examine whether the organisation's vulnerability management process is operating effectively, whether remediation timelines are being followed, and whether appropriate evidence of closure is maintained.\n\nThe independence of internal audit is essential. It should assess the work of management and the control environment without taking ownership of the controls it audits.\n\n## 2. Why Are Cybersecurity Audits Important?\n\nHaving cybersecurity policies, procedures, and controls documented does not automatically mean that they are implemented effectively.\n\nAn organisation needs an independent assessment to understand whether its controls are appropriately designed, implemented, and operating as intended.\n\nCybersecurity audits help identify gaps between expected security requirements and actual practices. They also provide management with an objective view of the organisation's cybersecurity posture and areas requiring improvement.\n\nAudits may be conducted against internal policies, regulatory requirements, contractual obligations, and relevant industry frameworks or standards, depending on the organisation's business context.\n\n## 3. Managing and Tracking Audit Findings\n\nOne practical challenge in cybersecurity audits is that audit findings are not always treated with the urgency they deserve.\n\nSometimes, audit observations are considered merely as reporting requirements rather than opportunities to improve the organisation's security posture. This can result in findings remaining unresolved for extended periods.\n\nTo avoid this, organisations should establish a formal audit issue tracking and remediation process.\n\nEach audit observation should have:\n\n- A clearly documented finding and associated risk.\n- An accountable action owner.\n- An agreed remediation or corrective action plan.\n- A target completion date.\n- A defined method for validating closure.\n- A documented status, including any approved exceptions or risk acceptance.\n\nThe audit or issue management process should also include periodic follow-ups. Simply recording an observation in an audit report is not sufficient; the organisation must ensure that agreed actions are implemented and their effectiveness is appropriately validated.\n\n## 4. Internal and External Cybersecurity Assessments\n\nOrganisations can use both internal capabilities and external expertise to obtain an assessment of their cybersecurity posture.\n\n**Internal audits** are conducted by the organisation's internal audit function. They provide independent assurance to the governing body and management regarding the effectiveness of governance, risk management, and controls.\n\n**External assessments** can provide an additional independent perspective. Organisations may engage specialised cybersecurity firms or qualified external assessors to evaluate technical controls, review security practices, and compare their environment against relevant industry standards.\n\nFor example, an organisation may use an external specialist to conduct a penetration test, security assessment, or an applicable PCI DSS assessment.\n\nThe appropriate approach depends on the organisation's size, risk exposure, regulatory requirements, available expertise, and assurance needs. External assessments can complement internal audit, but they do not automatically replace the independent internal audit function.\n\n## Conclusion\n\nEffective cybersecurity governance requires more than deploying security tools and implementing technical controls. It requires clear ownership, appropriate oversight, and independent assurance.\n\nThe Three Lines Model helps establish these responsibilities: the first line operates controls and manages risks, the second line provides governance and oversight, and the third line provides independent assurance.\n\nFor GRC and cybersecurity leaders, the objective is to ensure that these functions work together, that audit findings translate into measurable improvements, and that management has an accurate understanding of the organisation's cybersecurity posture.\n\nUltimately, cybersecurity audits should not be treated merely as compliance exercises. They should be used as an opportunity to identify weaknesses, improve controls, strengthen accountability, and enhance organisational cyber resilience.",

			    content: "## Introduction\n\nData security and data protection are important aspects of an organisation's overall cybersecurity programme. Before implementing security controls to protect information, an organisation must understand what data it holds, where that data resides, and how sensitive it is.\n\nThis makes data identification and classification two fundamental activities in any data protection programme. Once these activities are completed, organisations can implement appropriate protective measures such as encryption and Data Loss Prevention (DLP).\n\nLet's understand how these activities work in practice.\n\n## 1. Data Identification\n\nData identification is the process of discovering and documenting the data sources that an organisation owns, uses, stores, or processes.\n\nThe first question is: how do we identify all the data sources across an organisation?\n\nA useful starting point is the IT asset inventory that we discussed in our earlier article on IT Asset Management. Since the organisation has already identified its applications, systems, infrastructure, and other assets, this inventory can help us identify where organisational data resides.\n\nFor example, data sources may include:\n\n- **HR databases:** Containing employee records, personal information, and employment-related details.\n- **Cloud resources:** Cloud storage, databases, and other resources used to store or process organisational information.\n- **APIs:** Interfaces through which applications exchange or expose information.\n- **Spreadsheets and documents:** Files containing financial records, customer information, or internal business information.\n- **Laptops and endpoints:** Devices that may store or process business information locally.\n\nThe objective is to prepare a comprehensive view of the data sources across the organisation rather than limiting the exercise to centrally managed databases.\n\n## 2. Data Classification\n\nOnce the data sources have been identified, the next step is data classification.\n\nData classification is the process of examining information and assigning an appropriate classification based on its sensitivity, confidentiality requirements, business importance, and the organisation's data classification policy.\n\nFor example, an organisation's classification policy may specify that personally identifiable information (PII) must be classified as sensitive. Similarly, financial records, confidential business information, and certain internal documents may require a higher level of protection.\n\nA typical classification structure may include:\n\n- **Public:** Information approved for unrestricted public distribution.\n- **Internal:** Information intended for internal organisational use.\n- **Confidential:** Sensitive business or operational information that should only be accessed by authorised individuals.\n- **Restricted or Highly Confidential:** Information requiring the highest level of protection because unauthorised disclosure or misuse could have serious consequences.\n\nThe actual classification levels and criteria should be defined by the organisation's approved data classification policy.\n\n## 3. Data Labelling\n\nOnce information has been classified, the next step is to apply appropriate labels or tags to the data.\n\nData labelling makes the classification visible to users and systems, helping them understand how information should be handled and protected.\n\nFor example, a document classified as Confidential may carry a Confidential label. This label can then be used by other security mechanisms, including access controls, encryption policies, and DLP rules.\n\nIt is important to consider both structured and unstructured data during this activity.\n\n- **Structured data:** Information organised in a predefined format, usually stored in databases such as Oracle Database or Microsoft SQL Server.\n- **Unstructured data:** Information that does not follow a fixed tabular structure, such as emails, Word documents, PDFs, presentations, and other files.\n\nStructured data can often be identified and classified through database discovery and classification mechanisms. For unstructured data, organisations may use data discovery and classification tools, including solutions that use AI capabilities, to identify sensitive information within documents and files.\n\nThe objective is to ensure that both structured and unstructured information is appropriately classified and labelled wherever technically and operationally feasible.\n\n## 4. Protecting Data Through Encryption\n\nOnce data has been identified and classified, the organisation can determine what protective measures are required. One of the fundamental data protection mechanisms is encryption.\n\n**Data encryption** is the process of converting readable information, known as plaintext, into an unreadable format, known as ciphertext, using cryptographic algorithms and keys. Only someone with the appropriate decryption key can restore the original information.\n\nEncryption helps protect sensitive information, even when an unauthorised individual gains access to the underlying storage or communication channel, provided the encryption and key management mechanisms are appropriately implemented.\n\nOrganisations should consider encryption for data at rest, such as information stored in databases and hard drives, and data in transit, such as information exchanged between applications and systems.\n\nFor example, Windows endpoint hard drives can be protected using full-disk encryption technologies such as BitLocker.\n\n### Important Considerations for Encryption\n\nThere are two important considerations when implementing encryption:\n\n**1. Encryption requirements should follow data classification.**\n\nThe organisation's data classification policy should define which categories of information require encryption and under what circumstances. More sensitive information may require stronger protection and stricter handling requirements.\n\n**2. Encryption key management is critical.**\n\nEncryption is only as effective as the protection of its keys. If an unauthorised individual obtains the encryption key, the protection provided by encryption may be compromised.\n\nOrganisations should establish appropriate key management processes covering key generation, storage, access, rotation, backup, recovery, and secure destruction.\n\nAccess to highly sensitive encryption keys should be restricted. Depending on the sensitivity and risk, organisations can implement dual control, multiple approvals, and segregation of duties so that a single individual does not have unrestricted control over critical keys.\n\nModern databases, applications, and storage platforms may provide built-in encryption capabilities. However, organisations should verify that these capabilities are actually enabled and configured according to their security requirements rather than assuming encryption is automatically active.\n\n## 5. Data Loss Prevention (DLP)\n\nAnother important mechanism for protecting organisational information is **Data Loss Prevention (DLP)**.\n\nDLP is a set of technologies and controls designed to identify and prevent unauthorised disclosure, transfer, or movement of sensitive information outside the organisation's permitted boundaries.\n\nOrganisations can implement DLP solutions across endpoints, email systems, networks, and cloud environments to monitor how sensitive information is being accessed, shared, copied, or transferred.\n\nDLP policies can use data classification labels, keywords, sensitive information patterns, and other inspection rules to identify information that requires protection.\n\nFor example, an organisation may configure a DLP policy to detect the attempted transmission of sensitive customer records through an unauthorised email account or the uploading of confidential documents to an unapproved cloud service.\n\nDepending on the policy, a DLP solution may:\n\n- Block the unauthorised movement of information.\n- Generate an alert for the security team.\n- Quarantine or restrict the relevant activity.\n- Allow the activity while recording it for investigation or monitoring, where policy permits.\n\nThe objective is to ensure that sensitive information is handled in accordance with the organisation's data protection requirements.\n\n### Important Considerations for DLP Implementation\n\nThere are several practical considerations when implementing DLP controls.\n\n**1. DLP should be aligned with data classification.**\n\nData classification labels provide important context for DLP policies. For example, information labelled Confidential may be subject to stricter sharing and transfer restrictions than information classified as Public.\n\nHowever, labels should not be the only detection mechanism. DLP can also use content inspection, predefined patterns, keywords, and contextual rules to identify sensitive information.\n\n**2. Maintain the right balance between blocking and alerting.**\n\nOne of the challenges in DLP implementation is deciding when to block an activity and when to generate an alert.\n\nBlocking every activity that matches a rule may disrupt legitimate business operations. On the other hand, relying entirely on alerts may allow sensitive information to leave the organisation without timely intervention.\n\nOrganisations should define blocking and alerting policies based on the sensitivity of the information, business requirements, and the associated risk.\n\n**3. Ensure sufficient monitoring capacity.**\n\nDLP solutions can generate a significant number of alerts. Organisations must ensure that the responsible security teams have sufficient capacity to review, investigate, and respond to these alerts.\n\nDeploying a DLP solution without the operational capability to monitor its alerts can significantly reduce its effectiveness.\n\n**4. Continuously review and improve DLP rules.**\n\nDLP implementation is not a one-time activity. During the initial stages, policies may generate false positives by identifying legitimate business activities as potential data loss incidents.\n\nOrganisations should periodically review DLP alerts, investigate false positives, and fine-tune the rules to improve detection accuracy.\n\nExcessive false positives can consume the bandwidth of security operations teams and make it difficult to identify genuine data loss incidents. Continuous tuning is therefore essential for maintaining an effective DLP programme.\n\n## Conclusion\n\nEffective data protection begins with understanding what information an organisation holds, where it resides, and how sensitive it is.\n\nData identification provides visibility into organisational data sources, classification determines the level of protection required, and labelling makes that classification usable across systems and security controls.\n\nEncryption protects information from unauthorised disclosure, while DLP helps prevent sensitive information from being shared or transferred inappropriately.\n\nFor GRC and cybersecurity professionals, the objective is not simply to deploy encryption or DLP technologies. It is to ensure that these controls are aligned with the organisation's data classification policy, supported by appropriate governance, and continuously monitored and improved.\n\nA structured approach to data identification, classification, and protection helps organisations reduce data exposure and strengthen their overall cyber resilience.",

			    excerpt: "A practical refresher for GRC and cybersecurity professionals covering authentication, MFA, authorisation, Role-Based Access Control, and Privileged Access Management.",
			    content: "## Introduction\n\nIdentity and Access Management (IAM) is a fundamental component of an organisation's cybersecurity programme. It helps ensure that the right individuals and systems have access to the right resources, under the right conditions.\n\nIAM primarily involves two important concepts: **Authentication and Authorisation**. Other capabilities, such as Multi-Factor Authentication (MFA), Role-Based Access Control (RBAC), and Privileged Access Management (PAM), help organisations strengthen their access management practices.\n\nLet's understand these concepts and their practical application.\n\n## 1. Authentication and Authorisation\n\nAlthough these two terms are often used together, they serve different purposes.\n\n- **Authentication:** The process of verifying the identity of a user, device, or system attempting to access a resource. In simple terms, it answers the question: Who are you?\n- **Authorisation:** The process of determining what an authenticated user or system is permitted to access and which actions it can perform. It answers the question: What are you allowed to do?\n\nFor example, when an employee logs in to an organisation's application using their credentials, the application first authenticates their identity. Once authenticated, the application determines which information and functions that employee is authorised to access.\n\nTogether, these capabilities form an important part of IAM and help reduce the likelihood of unauthorised access to organisational resources.\n\n## 2. Multi-Factor Authentication (MFA)\n\nAuthentication is commonly performed using a username and password. However, relying only on a password creates a security risk, particularly if credentials are stolen, guessed, or compromised through phishing.\n\nMulti-Factor Authentication (MFA) strengthens authentication by requiring users to provide evidence from at least two different authentication factor categories.\n\nThese factors generally fall into three categories:\n\n- **Something you know:** A password, PIN, or another secret known to the user.\n- **Something you have:** A hardware security token, mobile phone, authenticator application, or security key.\n- **Something you are:** A biometric characteristic such as a fingerprint or facial recognition.\n\nFor example, when an employee enters a password and then approves a login request through an authenticator application, the organisation is using two different authentication factors.\n\nIt is important to understand that using two passwords does not constitute MFA because both belong to the same category: something you know.\n\n### Practical Considerations for MFA\n\nWhile implementing MFA, GRC and cybersecurity professionals should pay attention to a few practical considerations.\n\n**1. Review MFA exemption requests carefully.**\n\nIn real-world environments, organisations often receive requests for MFA exemptions due to business requirements, operational constraints, legacy applications, or technical limitations.\n\nThese requests should not be approved automatically. The security team should understand the underlying business requirement, assess the risk associated with the exemption, and evaluate the possible consequences if the affected account is compromised.\n\nWhere an exemption is unavoidable, appropriate compensating controls should be considered. These may include restricted network access, stronger monitoring, additional authentication safeguards, and time-bound approvals.\n\nExemptions should be documented, approved by authorised stakeholders, and reviewed periodically.\n\n**2. MFA is not a substitute for other security controls.**\n\nHaving MFA in place does not mean that an organisation has eliminated the risk of unauthorised access. MFA should be supported by appropriate access restrictions, secure authentication methods, monitoring, and regular access reviews.\n\nOrganisations should also consider phishing-resistant authentication methods for sensitive and privileged access wherever practical.\n\n## 3. Authorisation and Access Control\n\nOnce a user's identity has been authenticated, the next step is to determine what resources that user can access and what actions they can perform.\n\nThis is where authorisation comes into play. Organisations can implement different access control approaches to manage permissions.\n\n### Individual Access Assignment and Access Control Lists (ACLs)\n\nOne approach is to assign permissions directly to individual users or accounts for specific resources. Access Control Lists (ACLs) can be used to define which users or accounts are permitted to access a particular resource and what operations they can perform.\n\nFor example, an organisation may grant one employee read access to a particular application while granting another employee permission to read and modify its information.\n\nHowever, managing permissions individually across a large number of users and applications can become detailed and time-consuming. Every change in an employee's responsibilities may require multiple access updates.\n\nThis can make access administration difficult in large organisations.\n\n### Role-Based Access Control (RBAC)\n\nTo simplify access management, organisations commonly use **Role-Based Access Control (RBAC)**.\n\nInstead of assigning permissions to every individual user separately, RBAC groups permissions into predefined roles. Users are then assigned to the appropriate roles based on their responsibilities.\n\nFor example, when a new developer joins an organisation, rather than manually granting access to every application and resource required for development, the organisation can assign the developer to a predefined Developer role.\n\nThat role already contains the permissions required for the developer's responsibilities.\n\nSimilarly, predefined roles may exist for HR personnel, finance employees, database administrators, and other functions.\n\nRBAC makes access administration more manageable, particularly in organisations with many users and applications. It also helps maintain consistency when employees join, change roles, or leave the organisation.\n\nHowever, roles and their associated permissions must be reviewed periodically to ensure that users do not retain unnecessary access.\n\n## 4. Privileged Access Management (PAM)\n\nPrivileged Access Management (PAM) is the process of managing and securing accounts that have elevated permissions within an organisation's technology environment.\n\nExamples include:\n\n- System administrator accounts.\n- Database administrator accounts.\n- Network administrator accounts.\n- Domain administrator accounts.\n- Other accounts with elevated privileges.\n\nThese accounts require additional protection because their compromise could allow an attacker to gain extensive control over systems, applications, or sensitive information.\n\nOrganisations use specialised PAM solutions, such as CyberArk, to manage privileged credentials and control administrative access.\n\nPAM capabilities may include secure password vaulting, credential rotation, privileged session monitoring, approval workflows, and temporary access provisioning.\n\n### Just-in-Time (JIT) Privileged Access\n\nOne useful approach within privileged access management is **Just-in-Time (JIT) access**.\n\nInstead of providing users with permanent administrative privileges, JIT provides elevated access only when it is required and for a defined period.\n\nFor example, a database administrator may request elevated access to perform a specific maintenance activity. After the request is approved, the required privileged access is provided for a limited duration. Once the approved period expires or the task is completed, the elevated access is automatically revoked.\n\nDepending on the PAM solution and implementation, this may involve temporarily elevating permissions or creating temporary privileged accounts that are removed or disabled after use.\n\nThis reduces the number of permanently privileged accounts and limits the period during which elevated permissions are available.\n\n### Important Considerations for PAM\n\nWhile implementing PAM, organisations should consider the following:\n\n**1. Restrict the number of privileged accounts.**\n\nThe organisation should keep privileged accounts to the minimum number genuinely required for business and technical operations. Unnecessary administrative accounts should be removed or disabled.\n\n**2. Enforce MFA for privileged access.**\n\nMFA should be mandatory for privileged accounts because the compromise of an administrative account can have serious consequences for the organisation.\n\n**3. Apply stronger credential management.**\n\nPrivileged credentials should be unique, securely stored, and protected through appropriate password complexity and rotation requirements. Organisations should avoid shared or permanently exposed administrative credentials wherever possible.\n\n**4. Monitor privileged activities.**\n\nPrivileged sessions and administrative actions should be logged and monitored. This helps organisations identify suspicious activity and investigate potential misuse of elevated permissions.\n\n**5. Review privileged access periodically.**\n\nAdministrative privileges should be reviewed to ensure that they remain necessary and appropriate for the user's responsibilities.\n\n## Conclusion\n\nIdentity and Access Management is much more than providing users with usernames and passwords. It involves verifying identities, determining access permissions, and controlling how users and systems interact with organisational resources.\n\nAuthentication establishes identity, MFA strengthens the authentication process, and authorisation determines what an authenticated user is permitted to do. RBAC simplifies permission management through predefined roles, while PAM provides additional protection for highly privileged accounts.\n\nFor GRC and cybersecurity professionals, the objective is to ensure that access is granted appropriately, excessive privileges are avoided, and sensitive administrative activities remain controlled and monitored.\n\nRevisiting these fundamental IAM concepts helps organisations reduce unauthorised access risks and strengthen their overall cybersecurity posture.",
